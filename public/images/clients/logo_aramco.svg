  <g fill="#475569">
    <text x="145" y="36" font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="22" font-weight="900" text-anchor="end">أرامكو</text>
    <text x="145" y="58" font-family="'Space Grotesk', 'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="800" text-anchor="end" letter-spacing="0.5">aramco</text>
